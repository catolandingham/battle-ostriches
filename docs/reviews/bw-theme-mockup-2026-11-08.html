<!doctype html><meta charset=utf-8>
<style>
*{box-sizing:border-box}body{margin:0;background:#d8d8d8;font-family:-apple-system,Helvetica,Arial,sans-serif;padding:24px}#x{display:flex;gap:24px;align-items:flex-start}
.ph{width:390px;height:664px;background:#000;color:#fff;padding:12px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;border:1.5px solid #fff;padding:10px 12px}
.ct{font-size:13px;letter-spacing:.08em;line-height:1.5}.ct b{font-weight:700}
.st{display:flex;gap:12px;font-size:14px;margin-top:4px}.st span{display:flex;align-items:center;gap:4px}
.btns{display:flex;gap:8px}.ib{width:36px;height:36px;border:1.5px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center}
.msg{border:1.5px solid #fff;padding:12px;text-align:center;font-size:16px}.msg.inv{background:#fff;color:#000}
.board{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.c{aspect-ratio:1;border:1px solid #2e2e2e;position:relative}
.c.lit{border:2px solid #fff;background:#3a3a3a}
.c.you{border:2.5px solid #fff}
.c svg{position:absolute;inset:0;width:100%;height:100%}
.c .k{position:absolute;left:3%;top:3%;width:52%;height:52%}
.c .n{position:absolute;right:3px;bottom:1px;font-size:12px;font-weight:700}
.act{margin-top:auto;display:flex;gap:8px}.act div{flex:1;border:1.5px solid #fff;text-align:center;padding:14px;font-size:17px}.act .on{background:#fff;color:#000;font-weight:700}
.cap{font-size:12px;color:#000;margin-top:6px;width:390px}
</style><div id=x></div>
<script>
const L='fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"';
const A={
ost:`<svg viewBox="0 0 40 40"><circle cx="17" cy="26" r="7" ${L}/><path d="M22 21L25 9" ${L}/><circle cx="26" cy="8" r="2.2" ${L}/><path d="M28 8L32 9" ${L}/><path d="M15 33L14 37M19 33L20 37" ${L}/></svg>`,
vul:`<svg viewBox="0 0 40 40"><path d="M5 18L20 26L35 18" ${L}/><circle cx="20" cy="15" r="3.5" ${L}/></svg>`,
hye:`<svg viewBox="0 0 40 40"><path d="M10 30V16L14 9L18 15H22L26 9L30 16V30Z" ${L}/><circle cx="16" cy="21" r="1" fill="#fff"/><circle cx="24" cy="21" r="1" fill="#fff"/><path d="M18 26H22" ${L}/></svg>`,
bad:`<svg viewBox="0 0 40 40"><path d="M9 14C9 9 14 7 20 7C26 7 31 9 31 14C31 23 25 33 20 33C15 33 9 23 9 14Z" ${L}/><path d="M14 9L18 30M26 9L22 30" ${L}/></svg>`,
leaf:`<svg viewBox="0 0 40 40"><path d="M10 30C10 18 18 10 30 10C30 22 22 30 10 30Z" ${L}/><path d="M10 30L24 16" ${L}/></svg>`,
rock:`<svg viewBox="0 0 40 40"><path d="M8 29L14 18L19 24L24 15L32 29Z" ${L}/></svg>`,
egg:`<svg viewBox="0 0 40 40"><ellipse cx="20" cy="21" rx="7" ry="9" ${L}/></svg>`};
const K={egg:'<svg class=k viewBox="0 0 40 40"><ellipse cx="20" cy="21" rx="13" ry="16" fill="#fff"/></svg>',
maybe:'<svg class=k viewBox="0 0 40 40"><ellipse cx="20" cy="21" rx="13" ry="16" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="6 5"/></svg>',
bird:'<svg class=k viewBox="0 0 40 40"><path d="M4 16L13 21C12 30 19 36 27 33C33 31 35 26 33 20L39 17L32 15C31 9 25 7 21 11C19 13 19 16 20 19C15 18 9 17 4 16Z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>',
mound:'<svg class=k viewBox="0 0 40 40"><path d="M2 34C6 26 10 25 13 21C16 15 24 15 27 21C30 25 34 26 38 34Z" fill="#fff"/></svg>'};
const ic={stone:'<svg width=14 height=14 viewBox="0 0 40 40"><path d="M8 29L14 18L19 24L24 15L32 29Z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>',leaf:'<svg width=14 height=14 viewBox="0 0 40 40"><path d="M10 30C10 18 18 10 30 10C30 22 22 30 10 30Z" fill="none" stroke="#fff" stroke-width="3"/></svg>',
q:'<span style="font-size:17px">?</span>',snd:'<svg width=18 height=18 viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><path d="M16 9a4 4 0 0 1 0 6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>',
brush:'<svg width=18 height=18 viewBox="0 0 24 24"><path d="M20.5 3.5C18 4.5 13 9 10.5 12.5L12 14C15.5 11.5 20 6.5 21 4Z" fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><path d="M9.6 13.4C7.4 13.4 5.8 15 5.8 17.1C5.8 18.6 4.8 19.6 3 20C5.4 21.5 9.8 21 11.2 18.7C12.1 17.2 11.7 15 9.6 13.4Z" fill="#fff"/></svg>'};
const D=(a,b)=>Math.max(Math.abs(a[0]-b[0]),Math.abs(a[1]-b[1]));
function phone(o){let g='';for(let y=0;y<7;y++)for(let x=0;x<9;x++){const k=x+','+y,p=[x,y];let cls='c',inner='';
 if(o.me&&D(p,o.me)>=1&&D(p,o.me)<=o.reach&&!(o.block||[]).includes(k))cls+=' lit';
 if(o.me&&k===o.me.join(','))cls+=' you';
 if(['0,0','8,6'].includes(k))inner+=A.leaf; if(['4,0','4,6'].includes(k))inner+=A.rock;
 for(const [kk,a] of Object.entries(o.an||{}))if(kk===k)inner+=A[a];
 for(const [kk,m] of Object.entries(o.mk||{}))if(kk===k)inner+=K[m[0]]+(m[1]?'<span class=n>'+m[1]+'</span>':'');
 g+='<div class="'+cls+'">'+inner+'</div>';}
 return `<div><div class=ph><div class=top><div><div class=ct>ROUNDS <b>${o.r}</b> · EGGS <b>3</b></div><div class=st><span>${ic.leaf} ${o.food}</span><span>${ic.stone} 1/1</span></div></div><div class=btns><div class=ib>${ic.q}</div><div class=ib>${ic.snd}</div><div class=ib>${ic.brush}</div></div></div>
 <div class="msg${o.inv?' inv':''}">${o.msg}</div><div class=board>${g}</div><div class=act>${o.act.map((a,i)=>'<div class="'+(i?'':'on')+'">'+a+'</div>').join('')}</div></div><div class=cap>${o.cap}</div></div>`;}
document.getElementById('x').innerHTML=
phone({cap:'Ostrich, its turn. Outlined squares: where it can walk. Filled eggs with numbers: its eggs and turns until cold. The filled mound: it saw the badger dig in.',r:24,food:11,me:[4,4],reach:2,block:['6,3','6,5'],an:{'4,4':'ost','0,1':'vul','6,5':'hye'},mk:{'2,1':['egg',13],'6,2':['egg',9],'2,5':['egg',12],'6,3':['mound']},msg:'Your turn. Tap to move.',act:['Walk','Carry','Sit']})+
phone({cap:'Vulture, just landed. Dashed eggs: an egg may be there. Filled egg: one it found. Rock piles: where to get a stone.',r:24,food:15,an:{'3,2':'vul','6,5':'ost'},mk:{'2,1':['maybe'],'3,1':['maybe'],'4,1':['maybe'],'2,2':['maybe'],'2,3':['maybe'],'3,3':['maybe'],'4,3':['maybe'],'4,2':['maybe'],'7,1':['egg']},msg:'Egg nearby!',inv:1,act:['Fly','Throw']})+
phone({cap:'Hyena, its turn. Outlined squares: where it can walk. Bird outlines: a bird may be there. It sees the badger within 2.',r:24,food:15,me:[5,3],reach:2,an:{'5,3':'hye','3,4':'bad'},block:['3,4'],mk:{'6,1':['bird'],'7,1':['bird'],'7,2':['bird'],'7,3':['bird'],'6,4':['bird'],'7,4':['bird'],'7,5':['bird'],'6,5':['bird']},msg:'Your turn. Tap to move.',act:['Stay']});
</script>
