<!doctype html><meta charset=utf-8><link rel=stylesheet href="../../public/part1.css">
<style>body{background:#0b1830;margin:10px;font:15px sans-serif;color:#fff}.row{display:flex;gap:5px;margin:7px 0;align-items:center}.cell{position:relative;width:44px;height:44px;border-radius:5px}.a{background:#5a3d1e}.b{background:#7a5a3a}.l{background:#e6c654;outline:2px solid #222}.n{background:#1b3566}.lab{width:150px}
#board .cmark.cm-bird{width:56%;height:56%}#board .cmark .sol{fill:#fff;stroke:#111;stroke-width:2.4;stroke-linejoin:round}#board .cmark .dk{fill:#111}
#board .cmark.open .mk{stroke-dasharray:14 6}#board .cmark.open .mk-d{stroke-dasharray:17 3;stroke-dashoffset:1.5}#board .cmark.big{width:66%;height:66%}#board .cmark.plain .mk{stroke-dasharray:none;stroke:#fff;stroke-width:3.4;fill:none}#board .cmark.plain{filter:drop-shadow(0 0 1.2px #000) drop-shadow(0 0 1px #000)}#board .cmark.is{width:56%;height:56%}</style>
<div id=board></div>
<script>
const two=d=>'<path class="mk-d" pathLength="100" d="'+d+'"/><path class="mk" pathLength="100" d="'+d+'"/>';
const V=[
 ['A. Feather',two('M33 2C15 6 4 21 6 38C23 36 35 21 33 2Z')+'<path d="M6 38L28 9" style="stroke:#111;stroke-width:3.4;fill:none"/>',' open'],
 ['B. Flying bird',two('M2 26C8 10 15 9 20 22C25 9 32 10 38 26'),' open big'],
 ['C. Footprint',two('M20 39L20 19M20 19L7 6M20 19L20 2M20 19L33 6'),' open'],
 ['F. Side view, plain line','<path class="mk sol2" d="M3 15L12 21C11 30 18 36 26 33C32 31 35 26 33 20L39 17L32 15C31 9 25 7 21 11C19 13 19 16 20 19C15 18 9 16 3 15Z"/><circle class="dk" cx="27" cy="13.5" r="2.2"/>',' plain'],
 ['Mound 1: low hump','<path class="sol" d="M2 34C8 22 14 18 20 18C26 18 32 22 38 34Z"/>',' is'],
 ['Mound 2: dirt pile','<path class="sol" d="M2 34C6 26 10 25 13 21C16 15 24 15 27 21C30 25 34 26 38 34Z"/><circle class="dk" cx="15" cy="28" r="1.8"/><circle class="dk" cx="24" cy="25" r="1.8"/><circle class="dk" cx="29" cy="30" r="1.8"/>',' is'],
 ['Mound 3: with hole','<path class="sol" d="M2 34C8 20 14 16 20 16C26 16 32 20 38 34Z"/><path class="dk" d="M13 34C13 27 27 27 27 34Z"/>',' is']];
let h='';for(const [n,svg,cls] of V){h+='<div class=row><span class=lab>'+n+'</span>';for(const t of ['a','b','l','n'])h+='<div class="cell '+t+'"><i class="cmark cm-bird'+cls+'"><svg viewBox="0 0 40 40">'+svg+'</svg></i></div>';h+='</div>';}
document.getElementById('board').innerHTML=h;
</script>
